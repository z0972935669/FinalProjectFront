<!-- 固定頂欄 -->
<header class="shadow-sm mb-2">
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <div class="ms-auto d-flex align-items-center gap-2">
      <span class="text-muted fw-semibold" *ngIf="displayName">歡迎，{{ displayName }}</span>
      <button class="btn btn-outline-primary btn-sm mt-2 mb-2 shadow-sm" type="button"
        (click)="onLogout($event)">登出</button>
    </div>
  </div>
</header>

<!-- 側邊欄 -->
<nav id="app-sidepanel" class="app-sidepanel" [class.sidepanel-hidden]="!opened" aria-label="後台主選單">
  <!-- 行動裝置遮罩 -->
  <div id="sidepanel-drop" class="sidepanel-drop d-xl-none" (click)="toggleSidepanel(false)"></div>

  <div class="sidepanel-inner d-flex flex-column">
    <!-- 關閉按鈕 -->
    <button id="sidepanel-close" class="sidepanel-close d-xl-none" type="button" aria-label="關閉選單"
      (click)="toggleSidepanel(false)">
      &times;
    </button>

    <!-- 品牌 -->
    <div class="app-branding">
      <a routerLink="/erp/employeehome" class="d-inline-flex align-items-center text-decoration-none">
        <img class="logo-icon me-2" src="assets/backend/images/logo/logo.png" alt="Logo"
          style="height:auto;width:200px;">
        <span class="logo-text"></span>
      </a>
    </div>

    <!-- 主選單 -->
    <ul id="app-nav-main" class="app-nav app-nav-main flex-grow-1 app-menu list-unstyled accordion mt-5">
      <!-- 會員管理 -->
      <li class="nav-item has-submenu">
        <button class="nav-link submenu-toggle w-100 text-start d-flex align-items-center justify-content-between"
          type="button" data-bs-toggle="collapse" data-bs-target="#submenu-1" aria-expanded="false"
          aria-controls="submenu-1">
          <span class="d-flex align-items-center gap-2">
            <i class="bi bi-people fs-4"></i>
            <span class="nav-link-text fs-5 fw-bold">會員管理</span>
          </span>
          <span class="submenu-arrow"><i class="bi bi-chevron-down"></i></span>
        </button>
        <div id="submenu-1" class="collapse submenu submenu-1" data-bs-parent="#app-nav-main">
          <ul class="submenu-list list-unstyled ms-4">
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/memberlist"
                routerLinkActive="active">會員列表</a></li>
          </ul>
        </div>
      </li>
      <!-- 員工管理 -->
      <li class="nav-item has-submenu">
        <button class="nav-link submenu-toggle w-100 text-start d-flex align-items-center justify-content-between"
          type="button" data-bs-toggle="collapse" data-bs-target="#submenu-4" aria-expanded="false"
          aria-controls="submenu-4">
          <span class="d-flex align-items-center gap-2">
            <i class="bi bi-person-circle fs-4"></i>
            <span class="nav-link-text fs-5 fw-bold">員工管理</span>
          </span>
          <span class="submenu-arrow"><i class="bi bi-chevron-down"></i></span>
        </button>
        <div id="submenu-4" class="collapse submenu submenu-4" data-bs-parent="#app-nav-main">
          <ul class="submenu-list list-unstyled ms-4">
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeehome"
                routerLinkActive="active">主頁</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeelist"
                routerLinkActive="active">員工列表</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeelistdetail"
                routerLinkActive="active">個人資料</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeeattendance"
                routerLinkActive="active">打卡系統</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeeschedule"
                routerLinkActive="active">班表</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeeattendancerecords"
                routerLinkActive="active">考勤記錄</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeeleaveform"
                routerLinkActive="active">請休假申請單</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeemissingpunchform"
                routerLinkActive="active">忘卡申請單</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeeapprovallist"
                routerLinkActive="active">簽核系統</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/employeepasswordreset"
                routerLinkActive="active">修改密碼</a></li>
          </ul>
        </div>
      </li>

      <!-- 物料管理 -->
      <li class="nav-item has-submenu">
        <button class="nav-link submenu-toggle w-100 text-start d-flex align-items-center justify-content-between"
          type="button" data-bs-toggle="collapse" data-bs-target="#submenu-2" aria-expanded="false"
          aria-controls="submenu-2">
          <span class="d-flex align-items-center gap-2">
            <i class="bi bi-box-seam fs-4"></i>
            <span class="nav-link-text fs-5 fw-bold">物料管理</span>
          </span>
          <span class="submenu-arrow"><i class="bi bi-chevron-down"></i></span>
        </button>
        <div id="submenu-2" class="collapse submenu submenu-2" data-bs-parent="#app-nav-main">
          <ul class="submenu-list list-unstyled ms-4">
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/supplieslist"
                routerLinkActive="active">物品列表</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/suppliespurchasinglist"
                routerLinkActive="active">進貨單</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/suppliessaleslist"
                routerLinkActive="active">銷貨單</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/transferlist"
                routerLinkActive="active">轉倉單</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/suppliessupplierlist"
                routerLinkActive="active">供應商列表</a></li>
          </ul>
        </div>
      </li>

      <!-- 設備管理 -->
      <li class="nav-item has-submenu">
        <button class="nav-link submenu-toggle w-100 text-start d-flex align-items-center justify-content-between"
          type="button" data-bs-toggle="collapse" data-bs-target="#submenu-3" aria-expanded="false"
          aria-controls="submenu-3">
          <span class="d-flex align-items-center gap-2">
            <i class="bi bi-columns-gap fs-4"></i>
            <span class="nav-link-text fs-5 fw-bold">設備管理</span>
          </span>
          <span class="submenu-arrow"><i class="bi bi-chevron-down"></i></span>
        </button>
        <div id="submenu-3" class="collapse submenu submenu-3" data-bs-parent="#app-nav-main">
          <ul class="submenu-list list-unstyled ms-4">
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/equipmentlist"
                routerLinkActive="active">設備列表</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/equipmentpurchasinglist"
                routerLinkActive="active">購置單</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/equipmentrentlist"
                routerLinkActive="active">借出單</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/equipmentmaintenancelist"
                routerLinkActive="active">檢修單</a>
            </li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/equipmentsupplierlist"
                routerLinkActive="active">供應商列表</a></li>
          </ul>
        </div>
      </li>
      <!-- 文章管理 -->
      <li class="nav-item has-submenu">
        <!--//Bootstrap Icons: https://icons.getbootstrap.com/ -->
        <button class="nav-link submenu-toggle w-100 text-start d-flex align-items-center justify-content-between"
          type="button" data-bs-toggle="collapse" data-bs-target="#submenu-5" aria-expanded="false"
          aria-controls="submenu-5">
          <span class="d-flex align-items-center gap-2">
            <!--//Bootstrap Icons: https://icons.getbootstrap.com/ -->
            <i class="bi bi-journal-text fs-4"></i>
            <span class="nav-link-text fs-5 fw-bold">文章管理</span>
          </span>
          <span class="submenu-arrow"><i class="bi bi-chevron-down"></i></span><!--//submenu-arrow-->
        </button><!--//nav-link-->
        <div id="submenu-5" class="collapse submenu submenu-5" data-bs-parent="#app-nav-main">
          <ul class="submenu-list list-unstyled ms-4">
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/board-management"
                routerLinkActive="active">看板管理</a></li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/article-management"
                routerLinkActive="active">文章管理</a>
            </li>
            <li class="submenu-item"><a class="submenu-link fs-6" routerLink="/erp/report-management"
                routerLinkActive="active">檢舉管理</a>
            </li>
          </ul>
        </div>
      </li><!--//nav-item-->
      <!-- 文章管理 -->
    </ul>

    <!-- 側欄底部：登出 -->
    <div class="app-sidepanel-footer">
      <nav class="app-nav app-nav-footer">
        <ul class="app-menu footer-menu list-unstyled">
          <li class="nav-item">
            <button class="nav-link btn w-100 text-start" type="button" (click)="onLogout($event)">
              <span class="nav-icon"><i class="bi bi-box-arrow-right"></i></span>
              <span class="nav-link-text">登出</span>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</nav>

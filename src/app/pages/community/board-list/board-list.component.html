<div class="container my-5">
  <h2 class="text-center mb-4">社群看板列表</h2>

  <!-- Loading 狀態 -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-secondary" role="status">
      <span class="visually-hidden">載入中...</span>
    </div>
  </div>

  <!-- 看板列表 -->
  <div class="row" *ngIf="!loading && boards.length > 0">
    <div
      class="col-12 col-md-6 col-lg-4 mb-4"
      *ngFor="let board of boards"
      role="button"
      tabindex="0"
      [attr.aria-label]="'看板 ' + board.name"
      (click)="goToBoardPosts(board.id)"
    >
      <div class="board-card h-100 shadow-sm rounded">
        <img
          [src]="board.coverImageUrl"
          class="board-cover img-fluid rounded-top"
          [alt]="board.name"
        />
        <div class="board-info p-3">
          <h3 class="board-name">{{ board.name }}</h3>
          <p class="board-description mb-2">{{ board.description }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 無資料 -->
  <div *ngIf="!loading && boards.length === 0" class="text-center py-5">
    <p class="text-muted">目前沒有任何看板資料</p>
  </div>
</div>

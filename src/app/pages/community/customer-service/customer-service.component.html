<div class="chat-wrapper-and-button">
  <!-- 聊天框 -->
  <div class="chat-wrapper">
    <div class="chat-header">智能客服</div>
    <div #chatContainer class="chat-container">
      <div
        *ngFor="let message of chatLog"
        class="chat-message"
        [ngClass]="message.role"
      >
        <!-- AI 訊息：使用 innerHTML 顯示格式化內容 -->
        <div
          *ngIf="message.role === 'ai'"
          [innerHTML]="message.content"
          class="ai-formatted-content">
        </div>

        <!-- 用戶訊息：保持原本的文字顯示 -->
        <p *ngIf="message.role === 'user'">{{ message.content }}</p>
      </div>
    </div>
    <div class="chat-input-area">
      <textarea
        [(ngModel)]="userInput"
        (keydown.enter)="onEnter($event)"
        (compositionstart)="onCompositionStart()"
        (compositionend)="onCompositionEnd()"
        placeholder="輸入訊息..."
        rows="1"
        [disabled]="isAIResponding"
      ></textarea>
      <button
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || isAIResponding"
      >
        送出
      </button>
      <!-- 新增轉人工按鈕 -->
      <button
        class="transfer-btn"
        (click)="transferToHuman()"
        [disabled]="isAIResponding"
      >
        轉人工客服
      </button>
    </div>
  </div>
</div>

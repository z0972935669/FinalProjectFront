<div class="chat-page container-fluid">
  <div class="row">
    <!-- 左側好友區域 -->
    <div class="col-md-4 col-lg-3 border-end" style="min-height: 100vh;">
      <div class="p-3">
        <!-- 標題列加入通知 -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">
            <i class="fas fa-users"></i> 好友系統
          </h5>
          <!-- 好友通知放這裡 -->
          <app-friend-notifications></app-friend-notifications>
        </div>

        <!-- 搜尋和加好友區域 -->
        <div class="search-section mb-4">
          <h6 class="mb-2">
            <i class="fas fa-search"></i> 搜尋用戶
          </h6>
          <div class="input-group mb-2">
            <input
              type="text"
              class="form-control form-control-sm"
              placeholder="輸入用戶名稱..."
              [(ngModel)]="searchQuery"
              (input)="searchUsers()"
            >
            <button class="btn btn-outline-secondary btn-sm" (click)="clearSearch()" *ngIf="searchQuery">
              <i class="fas fa-times"></i>
            </button>
          </div>

          <!-- 搜尋結果 -->
          <div class="search-results" *ngIf="searchResults.length > 0">
            <div class="card" *ngFor="let user of searchResults">
              <div class="card-body p-2">
                <div class="d-flex justify-content-between align-items-center">
                  <div class="d-flex align-items-center">
                    <div class="avatar-circle me-2">
                      <i class="fas fa-user"></i>
                    </div>
                    <div>
                      <strong>{{ user.name }}</strong>
                      <br>
                      <small class="text-muted">{{ user.bio || '無個人簡介' }}</small>
                    </div>
                  </div>
                  <button class="btn btn-primary btn-sm" (click)="sendFriendRequest(user.id)">
                    <i class="fas fa-user-plus"></i> 加好友
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- 無搜尋結果 -->
          <div class="text-muted text-center py-2" *ngIf="searchQuery && searchResults.length === 0">
            <i class="fas fa-search"></i>
            <br>
            找不到符合的用戶
          </div>
        </div>

        <!-- 好友列表 -->
        <div class="friends-section">
          <h6 class="mb-2">
            <i class="fas fa-users"></i> 好友列表 ({{ friends.length }})
          </h6>

          <!-- 載入中 -->
          <div class="text-center py-3" *ngIf="isLoading">
            <div class="spinner-border spinner-border-sm" role="status"></div>
            <span class="ms-2">載入中...</span>
          </div>

          <!-- 好友列表 -->
          <div class="friends-list" *ngIf="!isLoading">
            <div class="friend-item card mb-2" *ngFor="let friend of friends">
              <div class="card-body p-2">
                <div class="d-flex justify-content-between align-items-center">
                  <div class="d-flex align-items-center">
                    <div class="avatar-circle me-2">
                      <i class="fas fa-user"></i>
                    </div>
                    <div>
                      <strong>{{ friend.name }}</strong>
                      <br>
                      <small class="text-muted">{{ friend.bio || '無個人簡介' }}</small>
                    </div>
                  </div>
                  <div class="btn-group btn-group-sm">
                    <button class="btn btn-success btn-sm" (click)="openPrivateChat(friend.id)" title="聊天">
                      <i class="fas fa-comment"></i>
                    </button>
                    <button class="btn btn-outline-danger btn-sm" (click)="removeFriend(friend.id)" title="移除好友">
                      <i class="fas fa-user-minus"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 無好友提示 -->
            <div class="text-center py-4 text-muted" *ngIf="friends.length === 0">
              <i class="fas fa-users fa-2x mb-2"></i>
              <br>
              還沒有好友
              <br>
              <small>使用上方搜尋功能來找朋友吧！</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側聊天區域 -->
    <div class="col-md-8 col-lg-9">
      <div class="p-3">
        <h5 class="mb-3">
          <i class="fas fa-comments"></i> 聊天室
        </h5>

        <!-- 聊天說明 -->
        <div class="alert alert-info" *ngIf="friends.length === 0">
          <i class="fas fa-info-circle"></i>
          先在左側新增好友，然後就可以開始聊天了！
        </div>

        <!-- 浮動聊天視窗 -->
        <app-chat-floating #chatFloating></app-chat-floating>
      </div>
    </div>
  </div>
</div>

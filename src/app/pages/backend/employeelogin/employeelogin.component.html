<!-- src/app/pages/backend/orders/orders.component.html (或你的登入頁檔名) -->
<div class="app-wrapper">
  <div class="app-content pt-3 p-md-3 p-lg-4">
    <div class="container-xl">

      <h1 class="badge bg-primary mb-3" style="font-size: xx-large;">員工登入</h1>

      <div class="row gy-4">
        <div class="col-12 col-lg-6">
          <div class="app-card app-card-account shadow-lg">
            <div class="app-card-header p-3 border-bottom-0">
              <div class="d-flex align-items-center gap-3">
                <div class="app-icon-holder">
                  <i class="bi bi-person-circle"></i>
                </div>
                <h4 class="app-card-title mb-0">登入系統</h4>
              </div>
            </div>

            <div class="app-card-body px-4">
              <form #f="ngForm" (ngSubmit)="login(f)" class="auth-form login-form text-start">
                <div class="mb-3">
                  <label class="form-label">帳號</label>
                  <input name="username" [(ngModel)]="vm.username" required pattern="^[A-Za-z0-9]{6,12}$"
                    class="form-control form-control-lg" placeholder="輸入帳號" autocomplete="username">
                </div>

                <div class="mb-3">
                  <label class="form-label">密碼</label>
                  <div class="input-group">
                    <input [type]="showPwd ? 'text' : 'password'" name="password" [(ngModel)]="vm.password" required
                      pattern="^[A-Za-z0-9]{4,12}$" class="form-control form-control-lg" placeholder="輸入密碼"
                      autocomplete="current-password">
                    <button type="button" class="btn btn-outline-secondary" (click)="showPwd=!showPwd" tabindex="-1">
                      <i class="bi" [ngClass]="showPwd ? 'bi-eye-slash' : 'bi-eye'"></i>
                    </button>
                  </div>

                  <div class="mt-3 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="RememberUsername" [(ngModel)]="vm.remember"
                        name="remember">
                      <label class="form-check-label" for="RememberUsername">記住帳號</label>
                    </div>
                    <a routerLink="/erp/employeepasswordreset">忘記密碼?</a>
                  </div>
                </div>

                <div class="text-danger mb-3" *ngIf="error">{{ error }}</div>

                <button type="submit" class="btn app-btn-primary btn-lg w-100" [disabled]="loading || f.invalid"
                  style="font-size:2rem; padding:.6rem; color:#fff;">
                  {{ loading ? '登入中…' : '登入' }}
                </button>
              </form>

              <div class="pt-4 text-center mb-3">
                尚無帳號？<a class="text-link" routerLink="/erp/employeeregister">建立帳號</a>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="d-none d-md-block"
            style="height:100%; min-height:420px; background:#e8f5e9 url('assets/backend/images/logo/login.png') center center / contain no-repeat; border-radius:.5rem;">
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="app-wrapper">
  <div class="app-content pt-3 p-md-3 p-lg-4">
    <div class="container-xl">
      <h1 class="badge bg-primary mb-3" style="font-size: xx-large;">修改密碼</h1>

      <div class="row gy-4">
        <!-- 左側卡片 -->
        <div class="col-12 col-lg-6">
          <div class="app-card app-card-account shadow-lg">
            <div class="app-card-header p-3 border-bottom-0">
              <div class="d-flex align-items-center gap-3">
                <div class="app-icon-holder">
                  <i class="bi bi-person-circle fs-3"></i>
                </div>
                <h4 class="app-card-title mb-0">使用者：{{ displayName }}</h4>
              </div>
            </div>

            <form #f="ngForm" (ngSubmit)="changePassword(f)">
              <div class="app-card-body px-4">
                <!-- 舊密碼 -->
                <div class="edit-row">
                  <div class="edit-label">舊密碼</div>
                  <div class="edit-field d-flex gap-2">
                    <input type="password" class="form-control form-control-sm" placeholder="請輸入舊密碼" required
                      [(ngModel)]="oldPassword" name="oldPassword" #oldPwd="ngModel"
                      [class.is-invalid]="oldPwd.invalid && (oldPwd.touched || oldPwd.dirty)" />
                    <button type="button" class="btn btn-danger btn-sm" (click)="verifyOldPassword()"
                      [disabled]="verifying || !oldPassword">
                      驗證舊密碼
                    </button>
                  </div>
                  <div class="form-text text-danger" *ngIf="oldPwd.invalid && (oldPwd.touched || oldPwd.dirty)">
                    請輸入舊密碼
                  </div>
                </div>

                <!-- 新密碼 -->
                <div class="edit-row">
                  <div class="edit-label">輸入新密碼</div>
                  <div class="edit-field">
                    <input type="password" class="form-control form-control-sm" placeholder="請輸入新密碼 (4–12 位英數字)"
                      required minlength="4" maxlength="12" pattern="^[A-Za-z0-9]{4,12}$" [(ngModel)]="newPassword"
                      name="newPassword" #np="ngModel" [class.is-invalid]="(np.invalid && (np.dirty || np.touched))" />
                  </div>
                  <div class="form-text text-danger" *ngIf="np.invalid && (np.dirty || np.touched)">
                    <span *ngIf="np.errors?.['required']">請輸入新密碼</span>
                    <span *ngIf="np.errors?.['minlength'] || np.errors?.['maxlength'] || np.errors?.['pattern']">
                      新密碼需為 4–12 位英數字
                    </span>
                  </div>
                </div>

                <!-- 確認新密碼（即時比對） -->
                <div class="edit-row">
                  <div class="edit-label">再次輸入新密碼</div>
                  <div class="edit-field">
                    <input type="password" class="form-control form-control-sm" placeholder="請再次輸入新密碼" required
                      minlength="4" maxlength="12" [(ngModel)]="confirmNewPassword" name="confirmNewPassword"
                      #cp="ngModel"
                      [class.is-invalid]="(cp.invalid && (cp.dirty || cp.touched)) || (cp.dirty && pwdMismatch)" />
                  </div>
                  <!-- 必填/長度錯誤 -->
                  <div class="form-text text-danger" *ngIf="cp.invalid && (cp.dirty || cp.touched)">
                    請再次輸入新密碼（4–12 位）
                  </div>
                  <!-- 兩次不一致：即時顯示 -->
                  <div class="form-text text-danger" *ngIf="cp.dirty && !cp.invalid && pwdMismatch">
                    兩次新密碼不一致
                  </div>
                </div>
              </div>

              <div class="app-card-footer p-4">
                <div *ngIf="error" class="text-danger mb-2">{{ error }}</div>
                <div *ngIf="success" class="text-success mb-2">{{ success }}</div>
                <button type="submit" class="btn app-btn-primary btn-lg w-100 mb-3"
                  [disabled]="changing || f.invalid || pwdMismatch">
                  送出
                </button>
              </div>
            </form>

          </div>
        </div>

        <!-- 右側圖片 -->
        <div class="col-12 col-lg-6 right-stack">
          <div class="d-none d-md-block"
            style="height:100%; background:#e8f5e9 url('assets/backend/images/logo/leaveform.png') center center / contain no-repeat; pointer-events:none;">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="app-wrapper" *ngIf="!loading; else state">
  <div class="app-content pt-3 p-md-3 p-lg-4">
    <div class="container-xl">
      <h1 class="badge bg-primary mb-3" style="font-size: xx-large;">編輯員工資料</h1>

      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="row gy-4">
          <!-- 左：基本資料 -->
          <div class="col-12 col-lg-6">
            <div class="app-card app-card-account shadow-lg">
              <div class="app-card-header p-3 border-bottom-0">
                <div class="d-flex align-items-center gap-3">
                  <div class="app-icon-holder"><i class="bi bi-person"></i></div>
                  <h4 class="app-card-title mb-0">基本資料</h4>
                </div>
              </div>

              <div class="app-card-body px-4">
                <!-- 大頭照 -->
                <!-- 大頭照 -->
                <div class="edit-row">
                  <div class="edit-label">大頭照</div>
                  <!-- 垂直排：圖片在上、按鈕在下 -->
                  <div class="edit-field d-flex flex-column align-items-start gap-2 photo-field">
                    <img [src]="previewUrl" (error)="onImgError($event)" alt="頭像"
                      style="width:120px;height:120px;object-fit:cover;border-radius:8px;" />

                    <input type="file" class="form-control form-control-sm" accept="image/*"
                      (change)="onFileChange($event)" />
                  </div>
                </div>


                <!-- 基本欄位 -->
                <!-- 姓名 -->
                <div class="edit-row">
                  <div class="edit-label">姓名</div>
                  <div class="edit-field">
                    <input type="text" class="form-control form-control-sm" formControlName="Name">
                  </div>
                </div>

                <!-- ✅ 性別 -->
                <div class="edit-row">
                  <div class="edit-label">性別</div>
                  <div class="edit-field">
                    <div class="btn-group" role="group" aria-label="Gender">
                      <input type="radio" class="btn-check" name="gender" id="gM"
                        [checked]="form.get('Gender')?.value === '男'" (change)="form.get('Gender')?.setValue('男')">
                      <label class="btn btn-sm btn-outline-primary me-3 rounded" for="gM">男</label>

                      <input type="radio" class="btn-check" name="gender" id="gF"
                        [checked]="form.get('Gender')?.value === '女'" (change)="form.get('Gender')?.setValue('女')">
                      <label class="btn btn-sm btn-outline-danger rounded" for="gF">女</label>
                    </div>
                  </div>
                </div>

                <div class="edit-row">
                  <div class="edit-label">身分證字號</div>
                  <div class="edit-field"><input type="text" class="form-control form-control-sm"
                      formControlName="IdentityNumber"></div>
                </div>
                <div class="edit-row">
                  <div class="edit-label">生日</div>
                  <div class="edit-field"><input type="date" class="form-control form-control-sm"
                      formControlName="BirthDate"></div>
                </div>
                <div class="edit-row">
                  <div class="edit-label">電話</div>
                  <div class="edit-field"><input type="text" class="form-control form-control-sm"
                      formControlName="Phone"></div>
                </div>
                <div class="edit-row">
                  <div class="edit-label">電子郵件</div>
                  <div class="edit-field"><input type="email" class="form-control form-control-sm"
                      formControlName="Email"></div>
                </div>

                <div class="edit-row">
                  <div class="edit-label">最高學歷</div>
                  <div class="edit-field">
                    <select class="form-select form-select-sm" formControlName="EducationLevel">
                      <option *ngFor="let ed of educationOptions" [value]="ed">{{ ed }}</option>
                    </select>
                  </div>
                </div>

                <div class="edit-row">
                  <div class="edit-label">戶籍地址</div>
                  <div class="edit-field"><input type="text" class="form-control form-control-sm"
                      formControlName="RegisteredAddress"></div>
                </div>

                <!-- 現居地址 + 同戶籍 -->
                <div class="edit-row align-items-center">
                  <div class="edit-label">現居地址</div>
                  <div class="edit-field">
                    <!-- ✅ 自訂綠色核取方塊，功能不變（仍綁 formControlName） -->
                    <label class="nh-check">
                      <input type="checkbox" formControlName="SameAsRegistered" />
                      <span>同戶籍地址</span>
                    </label>

                    <input type="text" class="form-control form-control-sm mt-2" formControlName="CurrentAddress" />
                  </div>
                </div>


                <div class="edit-row">
                  <div class="edit-label">身高 (cm)</div>
                  <div class="edit-field">
                    <select class="form-select form-select-sm" formControlName="Height">
                      <option *ngFor="let h of heightOptions" [ngValue]="h">{{ h }}</option>
                    </select>
                  </div>
                </div>

                <div class="edit-row">
                  <div class="edit-label">體重 (kg)</div>
                  <div class="edit-field">
                    <select class="form-select form-select-sm" formControlName="Weight">
                      <option *ngFor="let w of weightOptions" [ngValue]="w">{{ w }}</option>
                    </select>
                  </div>
                </div>

                <div class="edit-row">
                  <div class="edit-label">薪轉帳戶</div>
                  <div class="edit-field"><input type="text" class="form-control form-control-sm"
                      formControlName="PayrollBankAccount"></div>
                </div>
              </div>

              <div class="app-card-footer p-4">
                <button type="submit" class="btn app-btn-secondary me-3"
                  [disabled]="saving || !formReady || form.invalid" style="font-size: large;font-weight: bolder;">
                  {{ saving ? '儲存中…' : '儲存資料' }}
                </button>

                <!-- 明確帶 id 回詳細頁；若 id 還沒就緒，先回看自己 -->
                <a class="btn app-btn-secondary"
                  [routerLink]="id ? ['/erp/employeelistdetail', id] : ['/erp/employeelistdetail']"
                  style="font-size: large; font-weight: bolder;">
                  回到詳細資料
                </a>
              </div>
            </div>
          </div>

          <!-- 右：職務資訊 + 緊急聯絡人 -->
          <div class="col-12 col-lg-6 right-stack">
            <div class="app-card app-card-account shadow-lg">
              <div class="app-card-header p-3 border-bottom-0">
                <div class="d-flex align-items-center gap-3">
                  <div class="app-icon-holder"><i class="bi bi-briefcase"></i></div>
                  <h4 class="app-card-title mb-0">職務資訊</h4>
                </div>
              </div>
              <div class="app-card-body px-4">
                <!-- 在職狀態 -->
                <div class="edit-row">
                  <div class="edit-label">在職狀態</div>
                  <div class="edit-field">
                    <div class="btn-group" role="group">
                      <input type="radio" class="btn-check" name="empStatus" id="empYes"
                        [checked]="form.get('EmploymentStatusText')?.value === '在職'"
                        (change)="form.get('EmploymentStatusText')?.setValue('在職')">
                      <label class="btn btn-sm btn-outline-primary me-3 rounded" for="empYes">在職</label>

                      <input type="radio" class="btn-check" name="empStatus" id="empNo"
                        [checked]="form.get('EmploymentStatusText')?.value === '離職'"
                        (change)="form.get('EmploymentStatusText')?.setValue('離職')">
                      <label class="btn btn-sm btn-outline-danger rounded" for="empNo">離職</label>
                    </div>
                  </div>
                </div>

                <!-- 部門 -->
                <div class="edit-row">
                  <div class="edit-label">部門名稱</div>
                  <div class="edit-field">
                    <select class="form-select form-select-sm" formControlName="DepartmentId">
                      <option [ngValue]="null" disabled>請選擇部門</option>
                      <option *ngFor="let d of departments" [ngValue]="d.id">{{ d.name }}</option>
                    </select>
                    <div class="form-text" *ngIf="!form.value.DepartmentId && form.value.DepartmentName">
                      目前資料：{{ form.value.DepartmentName }}
                    </div>
                  </div>
                </div>

                <!-- 職稱 -->
                <div class="edit-row">
                  <div class="edit-label">職位名稱</div>
                  <div class="edit-field">
                    <!-- 刪除 [disabled]="jobsLoading || !jobs.length"；交由 TS 控制 -->
                    <select class="form-select form-select-sm" formControlName="JobTitleId">
                      <option [ngValue]="null" disabled>請先選擇部門</option>
                      <option *ngFor="let j of jobs" [ngValue]="j.id">{{ j.name }}</option>
                    </select>
                    <div class="form-text" *ngIf="jobsLoading">載入職稱中…</div>

                  </div>
                </div>

                <div class="edit-row">
                  <div class="edit-label">到職日期</div>
                  <div class="edit-field"><input type="date" class="form-control form-control-sm"
                      formControlName="HireDate"></div>
                </div>

                <!-- 良民證 -->
                <div class="edit-row">
                  <div class="edit-label">是否具有良民證</div>
                  <div class="edit-field">
                    <div class="btn-group" role="group">
                      <input type="radio" class="btn-check" name="pc" id="pcY"
                        [checked]="form.get('PoliceClearanceCertified')?.value === true"
                        (change)="setBool('PoliceClearanceCertified', true)">
                      <label class="btn btn-sm btn-outline-primary me-3 rounded" for="pcY">是</label>

                      <input type="radio" class="btn-check" name="pc" id="pcN"
                        [checked]="form.get('PoliceClearanceCertified')?.value === false"
                        (change)="setBool('PoliceClearanceCertified', false)">
                      <label class="btn btn-sm btn-outline-danger rounded" for="pcN">否</label>
                    </div>
                  </div>
                </div>

                <!-- 主管職 -->
                <div class="edit-row">
                  <div class="edit-label">是否為主管職</div>
                  <div class="edit-field">
                    <div class="btn-group" role="group">
                      <input type="radio" class="btn-check" name="sup" id="supY"
                        [checked]="form.get('IsSupervisor')?.value === true" (change)="setBool('IsSupervisor', true)">
                      <label class="btn btn-sm btn-outline-primary me-3 rounded" for="supY">是</label>

                      <input type="radio" class="btn-check" name="sup" id="supN"
                        [checked]="form.get('IsSupervisor')?.value === false" (change)="setBool('IsSupervisor', false)">
                      <label class="btn btn-sm btn-outline-danger rounded" for="supN">否</label>
                    </div>
                  </div>
                </div>

                <!-- 系統管理員 -->
                <div class="edit-row">
                  <div class="edit-label">是否為系統管理員</div>
                  <div class="edit-field">
                    <div class="btn-group" role="group">
                      <input type="radio" class="btn-check" name="adm" id="admY"
                        [checked]="form.get('IsAdmin')?.value === true" (change)="setBool('IsAdmin', true)">
                      <label class="btn btn-sm btn-outline-primary me-3 rounded" for="admY">是</label>

                      <input type="radio" class="btn-check" name="adm" id="admN"
                        [checked]="form.get('IsAdmin')?.value === false" (change)="setBool('IsAdmin', false)">
                      <label class="btn btn-sm btn-outline-danger rounded" for="admN">否</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 緊急聯絡人 -->
            <div class="app-card app-card-account shadow-lg mt-4">
              <div class="app-card-header p-3 border-bottom-0">
                <div class="d-flex align-items-center gap-3">
                  <div class="app-icon-holder"><i class="bi bi-telephone"></i></div>
                  <h4 class="app-card-title mb-0">緊急連絡人資訊</h4>
                </div>
              </div>
              <div class="app-card-body px-4">
                <div class="edit-row">
                  <div class="edit-label">姓名</div>
                  <div class="edit-field"><input type="text" class="form-control form-control-sm"
                      formControlName="EmergencyContactPerson"></div>
                </div>
                <div class="edit-row">
                  <div class="edit-label">電話</div>
                  <div class="edit-field"><input type="text" class="form-control form-control-sm"
                      formControlName="EmergencyContactPhone"></div>
                </div>
                <div class="edit-row">
                  <div class="edit-label">關係</div>
                  <div class="edit-field">
                    <select class="form-select form-select-sm" formControlName="EmergencyContactRelationship">
                      <option *ngFor="let r of relationshipOptions" [value]="r">{{ r }}</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div><!-- /row -->
      </form>
    </div>
  </div>
</div>

<ng-template #state>
  <div class="p-5 text-center" *ngIf="loading">讀取中…</div>
  <div class="p-5 text-danger text-center" *ngIf="!loading && error">{{ error }}</div>
</ng-template>

<div class="container py-5" style="max-width: 560px;">
  <h1 class="badge bg-primary fs-3 mb-4">設定新密碼</h1>

  <form #f="ngForm" (ngSubmit)="submit(f)" class="text-start">
    <div class="mb-3">
      <label class="form-label fw-bold">新密碼（4–12 位英數字）</label>
      <input name="newPassword" [(ngModel)]="newPassword" required pattern="^[A-Za-z0-9]{4,12}$" [type]="'password'"
        class="form-control form-control-lg" placeholder="輸入新密碼">
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">再輸入一次新密碼</label>
      <input name="confirm" [(ngModel)]="confirm" required [type]="'password'" class="form-control form-control-lg"
        placeholder="再次輸入新密碼">
      <div class="form-text text-danger" *ngIf="mismatch">兩次新密碼不一致</div>
    </div>

    <div class="text-danger mb-3" *ngIf="err">{{ err }}</div>
    <div class="text-success mb-3" *ngIf="ok">{{ ok }}</div>

    <button class="btn btn-primary btn-lg w-100" [disabled]="saving || f.invalid || mismatch">
      {{ saving ? '送出中…' : '設定新密碼' }}
    </button>

    <div class="pt-3 text-center">
      <a routerLink="/erp/employeelogin">返回登入</a>
    </div>
  </form>
</div>

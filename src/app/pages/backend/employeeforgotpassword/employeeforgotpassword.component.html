<div class="container py-5" style="max-width: 560px;">
  <h1 class="badge bg-success fs-3 mb-4">忘記密碼</h1>

  <form #f="ngForm" (ngSubmit)="submit(f)" class="text-start">
    <div class="mb-3">
      <label class="form-label fw-bold">帳號或 Email</label>
      <input name="accountOrEmail" [(ngModel)]="accountOrEmail" required class="form-control form-control-lg"
        placeholder="輸入帳號或 Email">
    </div>

    <div class="text-danger mb-3" *ngIf="err">{{ err }}</div>
    <div class="text-success mb-3" *ngIf="msg">{{ msg }}</div>

    <button class="btn btn-primary btn-lg w-100" [disabled]="sending || f.invalid">
      {{ sending ? '送出中…' : '寄送重設連結' }}
    </button>

    <div class="pt-3 text-center">
      <a routerLink="/erp/employeelogin">返回登入</a>
    </div>
  </form>
</div>

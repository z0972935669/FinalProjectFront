<div class="app-wrapper">
  <div class="app-content pt-3 p-md-3 p-lg-4">
    <div class="container-xl">

      <!-- 頁面標題 -->
      <div class="row g-3 mb-4 align-items-center justify-content-between">
        <div class="col-auto">
          <h1 class="badge bg-primary mb-0" style="font-size: xx-large;">所有員工列表</h1>
        </div>

        <!-- 搜尋 & 篩選 -->
        <!-- 部門篩選（會影響職稱下拉內容） -->
        <div class="col-auto">
          <select class="form-select w-auto" style="font-size: large;font-weight: bolder;" [ngModel]="deptSel()"
            (ngModelChange)="onDeptChange($event)">
            <option [ngValue]="'all'">所有部門</option>
            <option *ngFor="let d of deptOptions" [ngValue]="d.id">{{ d.name }}</option>
          </select>
        </div>

        <!-- 職稱篩選（隨部門動態改變） -->
        <div class="col-auto">
          <select class="form-select w-auto" style="font-size: large;font-weight: bolder;" [ngModel]="titleSel()"
            (ngModelChange)="titleSel.set($event)">
            <option [ngValue]="'all'">選擇職稱</option>
            <option *ngFor="let t of titleOptions()" [ngValue]="t.id">{{ t.name }}</option>
          </select>
        </div>

        <!-- 關鍵字 -->
        <div class="col-auto">
          <form class="table-search-form row gx-1 align-items-center" (submit)="$event.preventDefault()">
            <div class="col-auto">
              <input type="text" class="form-control search-orders" style="font-size: large;font-weight: bolder;"
                placeholder="搜尋關鍵字" [ngModel]="keyword()" (ngModelChange)="keyword.set($event)" name="kw">
            </div>
            <div class="col-auto">
              <button type="button" class="btn app-btn-secondary" style="font-size: large;font-weight: bolder;"
                (click)="keyword.set(keyword())">搜尋</button>
            </div>
          </form>
        </div>

      </div>

      <!-- 表格 -->
      <div class="app-card app-card-orders-table shadow-sm mb-5">
        <div class="app-card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover mb-0 text-left shadow-lg">
              <thead>
                <tr>
                  <th class="cell">序號</th>
                  <th class="cell">部門</th>
                  <th class="cell">職稱</th>
                  <th class="cell">姓名</th>
                  <th class="cell">狀態</th>
                  <th class="cell">詳細資料</th>
                  <th class="cell">編輯</th>
                </tr>
              </thead>
              <tbody>
                <!-- 載入中 -->
                <tr *ngIf="loading()">
                  <td colspan="7" class="cell text-center">載入中…</td>
                </tr>

                <!-- 錯誤 -->
                <tr *ngIf="!loading() && error()">
                  <td colspan="7" class="cell text-danger">{{ error() }}</td>
                </tr>

                <!-- 員工資料 -->
                <tr *ngFor="let e of filteredEmployees(); let i = index">
                  <td class="cell">{{ i + 1 }}</td>
                  <td class="cell">{{ e.departmentId | deptName }}</td>
                  <td class="cell">{{ e.jobTitleId | titleName }}</td>
                  <td class="cell">{{ e.name }}</td>
                  <td class="cell">
                    <span class="badge" [class.bg-success]="e.employmentStatus"
                      [class.bg-secondary]="!e.employmentStatus" style="font-size: large; font-weight: bolder;">
                      {{ e.employmentStatus | empStatus }}
                    </span>
                  </td>
                  <!-- 其他欄位不變 -->
                  <!-- ✅ 詳細資料 -->
                  <td class="cell">
                    <a class="btn btn-outline-warning" style="font-size: large;font-weight: bolder;"
                      [routerLink]="['/erp/employeelistdetail', e.employeeId]">
                      詳細資料
                    </a>
                  </td>

                  <!-- ✅ 編輯 -->
                  <td class="cell">
                    <a class="btn btn-outline-danger" style="font-size: large;font-weight: bolder;"
                      [routerLink]="['/erp/employeelistedit', e.employeeId]">
                      編輯資訊
                    </a>
                  </td>
                </tr>


              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 分頁 -->
      <nav class="app-pagination d-flex justify-content-center align-items-center"
        style="font-size: large;font-weight: bolder;">
        <ul class="pagination mb-0">
          <li class="page-item"><a class="page-link" href="#">第一頁</a></li>
          <li class="page-item"><a class="page-link" href="#">上一頁</a></li>
          <li class="page-item active"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">3</a></li>
          <li class="page-item"><a class="page-link" href="#">下一頁</a></li>
          <li class="page-item"><a class="page-link" href="#">最後頁</a></li>
        </ul>

        <!-- 每頁顯示 -->
        <div class="d-flex align-items-center text-nowrap ms-4">
          <span class="me-2">每頁顯示</span>
          <select class="form-select form-select-sm me-2 w-auto">
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
          </select>
          <span>筆</span>
        </div>
      </nav>
    </div>
  </div>
</div>

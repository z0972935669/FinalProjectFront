<!-- Single Page Header start -->
<div class="container-fluid page-header py-5">
  <h1 class="text-center text-white display-6">入住</h1>
  <ol class="breadcrumb justify-content-center mb-0">
    <li class="breadcrumb-item"><a routerLink="/show/">首頁</a></li>
    <li class="breadcrumb-item"><a routerLink="/show/room-list">預約參訪&房型介紹</a></li>
    <li class="breadcrumb-item active text-white">即刻入住</li>
  </ol>
</div>
<!-- Single Page Header End -->
<div class="container py-5" *ngIf="room; else notFound">
  <h1 class="text-primary mb-4">即刻入住</h1>
  <div class="row g-5">
    <!-- Image Carousel -->
    <div class="col-lg-6">
      <div id="roomCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item" *ngFor="let image of room.images; let i = index" [ngClass]="{ active: i === 0 }">
            <img [src]="getImageUrl(image)" class="d-block w-100" alt="{{ room.fRoomAlias }}"
              (error)="handleImageError($event)" loading="lazy">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#roomCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#roomCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
    <!-- Room Details -->
    <div class="col-lg-6">
      <h3>{{ room?.fRoomAlias }}</h3>
      <p>{{ room.fRoomDescription }}</p>
      <h4 class="text-primary">價格: NT${{ room.fRoomPrice | number:'1.0-0' }}</h4>
      <p>床位數: {{ room.fBedCount }}</p>
      <p>狀態: {{ room.isAvailable ? '可入住' : '已滿' }}</p>
      <button class="btn btn-primary btn-lg" [disabled]="!room.isAvailable" (click)="openBookingModal()">即刻入住</button>
    </div>
  </div>

  <!-- Booking Modal -->
  <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="bookingModalLabel">入住方案: {{ room?.fRoomAlias }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="name" class="form-label">姓名</label>
              <input type="text" class="form-control" id="name" [(ngModel)]="bookingForm.name" name="name"
                [disabled]="isLoggedIn" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">電子郵件</label>
              <input type="email" class="form-control" id="email" [(ngModel)]="bookingForm.email" name="email"
                [disabled]="isLoggedIn" required>
            </div>
            <div class="mb-3">
              <label for="contact" class="form-label">電話 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="contact" [(ngModel)]="bookingForm.contact" name="contact"
                required>
            </div>
            <div class="mb-3">
              <label for="checkInDate" class="form-label">入住時間 <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="checkInDate" [(ngModel)]="bookingForm.checkInDate"
                name="checkInDate" [min]="minCheckInDate" required>
            </div>
            <div *ngIf="isFormReady()" class="mt-3">
              <div id="paypal-button-container"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
            (click)="closeBookingModal()">取消</button>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #notFound>
  <div class="text-center">
    <h2>房間不存在</h2>
    <a routerLink="/room-list" class="btn btn-primary">返回房型列表</a>
  </div>
</ng-template>

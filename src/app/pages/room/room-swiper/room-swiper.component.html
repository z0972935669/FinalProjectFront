<div class="swiper" #swiperRef>
  <div class="swiper-wrapper">
    <div class="swiper-slide" *ngFor="let item of items">
      <div class="vesitable-item">
        <div class="vesitable-img">
          <img [src]="item.image" class="img-fluid w-100 rounded-top" [alt]="item.fRoomAlias" />
        </div>
        <div class="p-4 rounded-bottom">
          <h5>{{ item.fRoomAlias }}</h5>
          <p>{{ item.fRoomDescription }}</p>
          <h5 class="text-primary">${{ item.fRoomPrice }}</h5>
          <a [routerLink]="['/show/room-detail', item.fRoomId]"
            class="btn border border-secondary rounded-pill px-3 text-primary">
            <i class="fa fa-shopping-bag me-2 text-primary"></i> 即刻入住
          </a>
        </div>
      </div>
    </div>
  </div>
  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>
</div>

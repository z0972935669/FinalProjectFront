<!-- Single Page Header start -->
<div class="head">
  <div>

      <a routerLink="/show/" class="breadcrumb-link">首頁</a>

    <li class="breadcrumb-item active text-white">活動</li>

  </div>
  <!-- Single Page Header End -->
  <!-- Fruits Shop Start-->
  <div class="container-fluid fruite py-3">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-12">
          <div class="row g-4"></div>
          <!-- 輪播圖 -->
          <div
            id="carouselExampleControls"
            class="carousel slide"
            data-bs-ride="carousel"
          >
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  src="../../../../assets/img/event/1/001.png"
                  class="d-block w-100"
                  alt="..."
                />
              </div>
              <div class="carousel-item">
                <img
                  src="./../../../assets/img/event/1/手作課程(大圖).png"
                  class="d-block w-100"
                  alt="..."
                />
              </div>
              <div class="carousel-item">
                <img
                  src="./../../../assets/img/event/1/端午節.png"
                  class="d-block w-100"
                  alt="..."
                />
              </div>
            </div>
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#carouselExampleControls"
              data-bs-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#carouselExampleControls"
              data-bs-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
          <!-- 排序列 -->
          <div class="toolbar mb-3">
            <div class="left">
              <div class="btn-group btn-group-sm" role="group">
                <button
                  type="button"
                  class="btn cat-btn"
                  (click)="setCategory('所有活動')"
                  [class.active]="selectedCategory === '所有活動'"
                >
                  所有活動
                </button>

                <button
                  type="button"
                  class="btn cat-btn"
                  (click)="setCategory('運動類')"
                  [class.active]="selectedCategory === '運動類'"
                >
                  運動類
                </button>

                <button
                  type="button"
                  class="btn cat-btn"
                  (click)="setCategory('手作類')"
                  [class.active]="selectedCategory === '手作類'"
                >
                  手作類
                </button>

                <button
                  type="button"
                  class="btn cat-btn"
                  (click)="setCategory('講座類')"
                  [class.active]="selectedCategory === '講座類'"
                >
                  講座類
                </button>

                <button
                  type="button"
                  class="btn cat-btn"
                  (click)="setCategory('出去玩')"
                  [class.active]="selectedCategory === '出去玩'"
                >
                  出去玩
                </button>
              </div>

              <button
                type="button"
                class="btn cat-btn"
                [routerLink]="['/show/event/calender']"
              >
                行事曆
              </button>
            </div>

            <form
              class="yotta-search"
              (submit)="$event.preventDefault()"
              role="search"
            >
              <input
                type="text"
                [formControl]="searchCtrl"
                placeholder="想找什麼活動？"
              />
              <button type="submit">搜尋</button>
            </form>
          </div>
        </div>

        <!-- 放卡片的框架 -->
        <div class="col-lg-12">
          <div class="row g-4 justify-content-center">
            <!-- 放卡片的框架 -->
            <div class="col-lg-12">
              <div class="row g-4 justify-content-center">
                <!-- 只渲染當頁資料 -->
                <div
                  class="col-md-6 col-xl-3"
                  *ngFor="let e of pageItems; trackBy: trackById"
                >
                  <div class="rounded position-relative fruite-item h-100">
                    <div class="fruite-img fixed-img">
                      <img
                        [src]="e.imageUrl"
                        class="img-fluid w-100 rounded-top"
                        alt=""
                      />
                    </div>

                    <div
                      class="p-4 border border-secondary border-top-0 rounded-bottom"
                    >
                      <h5 class="card-title fw-bold mb-2">{{ e.title }}</h5>
                      <p class="card-text text-secondary mb-3 subtitle-2lines">
                        {{ e.subtitle }}
                      </p>

                      <p class="text-danger fw-bold fs-6 mb-2">
                        {{ e.priceText }}
                      </p>
                      <p class="mb-3">
                        <strong>主辦方：</strong>{{ e.organizer }}
                      </p>
                      <p class="mb-3">
                        <strong>時間：</strong>{{ e.eventDateTimeStart }}
                      </p>

                      <div
                        class="small text-muted d-flex flex-wrap gap-3 meta-2rows"
                      >
                        <span>📍 {{ e.location }}</span>
                        <span>⏱️ {{ e.duration }}</span>
                        <span>👥 {{ e.attendees }} 人</span>
                      </div>

                      <div class="content__mark hide--pad">
                        <div
                          class="mark__dot"
                          [ngStyle]="{
                            'background-color':
                              e.states === '招生中' ? '#4caf50' : '#ff9800'
                          }"
                        ></div>
                        <span>狀態：</span>
                        <span>{{ e.states }}</span>
                      </div>
                    </div>

                    <a
                      class="stretched-link"
                      *ngIf="e.batchID"
                      [routerLink]="['/show/event', e.batchID]"
                    ></a>
                  </div>
                </div>

                <!-- 分頁器（獨立一塊，根據資料自動產生頁數） -->
                <div class="col-12" *ngIf="totalPages > 1">
                  <div class="pagination d-flex justify-content-center mt-5">
                    <a
                      href
                      class="rounded"
                      [class.disabled]="currentPage === 1"
                      (click)="$event.preventDefault(); prevPage()"
                      >&laquo;</a
                    >

                    <a
                      href
                      class="rounded"
                      *ngFor="let p of pageNumbers"
                      [class.active]="p === currentPage"
                      (click)="$event.preventDefault(); goToPage(p)"
                      >{{ p }}</a
                    >

                    <a
                      href
                      class="rounded"
                      [class.disabled]="currentPage === totalPages"
                      (click)="$event.preventDefault(); nextPage()"
                      >&raquo;</a
                    >
                  </div>

                  <div class="text-center small text-muted mt-2">
                    第 {{ currentPage }} / {{ totalPages }} 頁，共
                    {{ events.length }} 筆
                  </div>
                </div>

                <!-- 沒有資料時 -->
                <div
                  class="col-12 text-center text-muted py-5"
                  *ngIf="events.length === 0"
                >
                  目前沒有資料
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<section class="py-5 mt-5" style="background-color: #eee">
  <div class="container h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-lg-12 col-xl-11">
        <div class="card text-black" style="border-radius: 25px">
          <div class="card-body p-md-5">
            <div class="row justify-content-center">
              <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
                <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">
                  註冊
                </p>

                <form class="mx-1 mx-md-4" (ngSubmit)="register()">
                  <!-- 帳號 -->
                  <div class="mb-3">
                    <label class="form-label">帳號</label>
                    <input
                      type="text"
                      class="form-control"
                      [(ngModel)]="account"
                      name="account"
                      required
                      (ngModelChange)="onAccountChange()"
                      (blur)="checkAccount()"
                      #acc="ngModel"
                    />
                    <!-- 必填紅字 -->
                    <div
                      class="text-danger small mt-1"
                      *ngIf="acc.invalid && (acc.dirty || acc.touched)"
                    >
                      <div *ngIf="acc.errors?.['required']">請輸入帳號</div>
                    </div>
                    <!-- 重複紅字 / 檢查中文字 -->
                    <div
                      class="text-danger small mt-1"
                      *ngIf="accountTaken === true"
                    >
                      此帳號已被註冊
                    </div>
                    <div class="text-muted small" *ngIf="checkingAccount">
                      檢查中…
                    </div>
                  </div>

                  <!-- 姓名 -->
                  <div class="mb-3">
                    <label class="form-label">姓名</label>
                    <input
                      type="text"
                      class="form-control"
                      [(ngModel)]="name"
                      name="name"
                      required
                      #nm="ngModel"
                    />
                    <div
                      class="text-danger small mt-1"
                      *ngIf="nm.invalid && (nm.dirty || nm.touched)"
                    >
                      <div *ngIf="nm.errors?.['required']">請輸入姓名</div>
                    </div>
                  </div>

                  <!-- 性別 -->
                  <div class="mb-3">
                    <label class="form-label">性別</label>
                    <select
                      class="form-select"
                      [(ngModel)]="gender"
                      name="gender"
                      required
                      #gd="ngModel"
                    >
                      <option value="" disabled selected>請選擇性別</option>
                      <option value="男">男</option>
                      <option value="女">女</option>
                    </select>
                    <div
                      class="text-danger small mt-1"
                      *ngIf="gd.invalid && (gd.dirty || gd.touched)"
                    >
                      <div *ngIf="gd.errors?.['required']">請選擇性別</div>
                    </div>
                  </div>

                  <!-- 生日 -->
                  <div class="mb-3">
                    <label class="form-label">生日</label>
                    <input
                      type="date"
                      class="form-control"
                      [(ngModel)]="birthDate"
                      name="birthDate"
                    />
                  </div>

                  <!-- 手機 -->
                  <div class="mb-3">
                    <label class="form-label">手機</label>
                    <input
                      type="text"
                      class="form-control"
                      [(ngModel)]="phone"
                      name="phone"
                      required
                      pattern="^09\d{8}$"
                      #phoneCtrl="ngModel"
                    />

                    <!-- 沒輸入 -->
                    <div
                      *ngIf="phoneCtrl.invalid && phoneCtrl.touched"
                      class="text-danger mt-1"
                    >
                      <div *ngIf="phoneCtrl.errors?.['required']">
                        手機號碼不可空白
                      </div>
                      <div *ngIf="phoneCtrl.errors?.['pattern']">
                        格式錯誤，請輸入09開頭共10碼
                      </div>
                    </div>
                  </div>

                  <!-- 電子郵件 -->
                  <div class="mb-3">
                    <label class="form-label">電子郵件</label>
                    <input
                      type="email"
                      class="form-control"
                      [(ngModel)]="email"
                      name="email"
                      required
                      (ngModelChange)="onEmailChange()"
                      (blur)="checkEmail()"
                      #em="ngModel"
                    />
                    <!-- 格式/必填紅字 -->
                    <div
                      class="text-danger small mt-1"
                      *ngIf="em.invalid && (em.dirty || em.touched)"
                    >
                      <div *ngIf="em.errors?.['required']">請輸入 Email</div>
                      <div *ngIf="em.errors?.['email']">Email 格式不正確</div>
                    </div>
                    <!-- 重複紅字 / 檢查中文字 -->
                    <div
                      class="text-danger small mt-1"
                      *ngIf="emailTaken === true"
                    >
                      此 Email 已被註冊
                    </div>
                    <div class="text-muted small" *ngIf="checkingEmail">
                      檢查中…
                    </div>
                  </div>

                  <!-- 密碼 -->
                  <div class="mb-3 position-relative">
                    <label class="form-label">密碼</label>
                    <input
                      [type]="showPassword ? 'text' : 'password'"
                      class="form-control"
                      [(ngModel)]="password"
                      name="password"
                      required
                      minlength="6"
                      #pw="ngModel"
                    />
                    <i
                      class="fas"
                      [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
                      (click)="togglePassword()"
                      style="
                        position: absolute;
                        top: 38px;
                        right: 15px;
                        cursor: pointer;
                      "
                    ></i>
                    <div
                      class="text-danger small mt-1"
                      *ngIf="pw.invalid && (pw.dirty || pw.touched)"
                    >
                      <div *ngIf="pw.errors?.['required']">請輸入密碼</div>
                      <div *ngIf="pw.errors?.['minlength']">密碼至少 6 碼</div>
                    </div>
                  </div>

                  <!-- 確認密碼 -->
                  <div class="mb-3 position-relative">
                    <label class="form-label">確認密碼</label>
                    <input
                      [type]="showConfirmPassword ? 'text' : 'password'"
                      class="form-control"
                      [(ngModel)]="confirmPassword"
                      name="confirmPassword"
                      required
                      #cpw="ngModel"
                    />
                    <i
                      class="fas"
                      [ngClass]="
                        showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'
                      "
                      (click)="toggleConfirmPassword()"
                      style="
                        position: absolute;
                        top: 38px;
                        right: 15px;
                        cursor: pointer;
                      "
                    ></i>
                    <div
                      class="text-danger small mt-1"
                      *ngIf="cpw.invalid && (cpw.dirty || cpw.touched)"
                    >
                      <div *ngIf="cpw.errors?.['required']">請再次輸入密碼</div>
                    </div>
                    <!-- 兩次密碼不一致紅字（即時） -->
                    <div
                      class="text-danger small mt-1"
                      *ngIf="
                        password &&
                        confirmPassword &&
                        password !== confirmPassword
                      "
                    >
                      兩次密碼不一致
                    </div>
                  </div>

                  <!-- 大頭貼上傳與預覽 -->
                  <div class="mb-3">
                    <label class="form-label">上傳大頭貼</label>
                    <input
                      type="file"
                      class="form-control"
                      (change)="onPhotoSelected($event)"
                    />
                    <div *ngIf="photoPreview" class="text-center mt-2">
                      <img
                        [src]="photoPreview"
                        class="img-thumbnail"
                        width="120"
                      />
                    </div>
                  </div>

                  <!-- 同意條款 -->
                  <div class="form-check d-flex justify-content-center mb-4">
                    <input
                      class="form-check-input me-2"
                      type="checkbox"
                      [(ngModel)]="agree"
                      name="agree"
                      #agreeCtrl="ngModel"
                      required
                    />
                    <label class="form-check-label"
                      >我同意 <a href="#">服務條款</a></label
                    >
                  </div>

                  <!-- 未勾選時的紅字提示 -->
                  <div
                    class="text-danger text-center small mb-3"
                    *ngIf="
                      agreeCtrl.invalid &&
                      (agreeCtrl.dirty || agreeCtrl.touched)
                    "
                  >
                    請先勾選同意
                  </div>

                  <!-- 送出 -->
                  <div class="d-flex justify-content-center">
                    <button
                      type="submit"
                      class="btn btn-primary btn-lg"
                      [disabled]="
                        !agree ||
                        checkingAccount ||
                        checkingEmail ||
                        accountTaken ||
                        emailTaken
                      "
                    >
                      註冊
                    </button>
                  </div>
                </form>
              </div>
              <!-- Demo 填寫按鈕 -->
              <div class="d-flex justify-content-center mb-3">
                <button
                  type="button"
                  class="btn btn-outline-secondary btn-sm"
                  (click)="fillDemoData()"
                >
                  Demo 填寫
                </button>
              </div>
              <div
                class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2"
              >
                <img
                  src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                  class="img-fluid"
                  alt="註冊插圖"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

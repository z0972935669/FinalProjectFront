<!-- 外層容器：置中 + 限制寬度 -->
<div class="container py-5">
  <div class="row justify-content-center">
    <!-- 依斷點限制寬度：手機滿版、桌機約 400~540px -->
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <div class="card shadow-sm">
        <div class="card-header bg-light">
          <h4 class="text-primary fw-bold mb-0">忘記密碼</h4>
        </div>

        <div class="card-body">
          <form (ngSubmit)="submit()" class="g-3">
            <div class="mb-3">
              <label class="form-label">請輸入您的 Email</label>
              <input
                type="email"
                class="form-control"
                [(ngModel)]="email"
                name="email"
                required
              />
            </div>

            <div class="d-grid">
              <button
                class="btn btn-primary"
                type="submit"
                [disabled]="loading"
              >
                送出
              </button>
            </div>

            <!-- 成功訊息 -->
            <div class="alert alert-success mt-3 mb-0" *ngIf="successMessage">
              {{ successMessage }}
            </div>

            <!-- 錯誤訊息 -->
            <div class="alert alert-danger mt-3 mb-0" *ngIf="errorMessage">
              {{ errorMessage }}
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

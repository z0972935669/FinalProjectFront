<section class="vh-100">
  <div class="container h-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="max-width: 450px; width: 100%">
      <h3 class="mb-3 text-center fw-bold">忘記密碼</h3>
      <form (ngSubmit)="sendResetLink()">
        <!-- Email 輸入欄位 -->
        <div class="mb-3">
          <label class="form-label">帳號 Email</label>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <!-- 提交按鈕 -->
        <button
          type="submit"
          class="btn btn-primary w-100 d-flex justify-content-center align-items-center"
          [disabled]="loading || cooldown > 0"
        >
          <img
            *ngIf="loading"
            src="assets/img/member/loading.gif"
            alt="loading"
            width="20"
            height="20"
            class="me-2"
          />
          {{
            loading
              ? "寄送中..."
              : cooldown > 0
              ? "請稍候 " + cooldown + " 秒"
              : "寄送驗證連結"
          }}
        </button>

        <!-- 訊息區塊 -->
        <div
          *ngIf="message"
          class="alert mt-3"
          [ngClass]="{
            'alert-success': message.includes('已寄出'),
            'alert-danger':
              message.includes('失敗') ||
              message.includes('請輸入') ||
              message.includes('請勿')
          }"
        >
          {{ message }}
        </div>
      </form>
    </div>
  </div>
</section>

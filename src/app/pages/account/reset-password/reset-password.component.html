<section class="vh-100">
  <div class="container h-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="max-width: 450px; width: 100%">
      <h3 class="mb-3 text-center fw-bold">重設密碼</h3>
      <form (ngSubmit)="resetPassword()">
        <!-- 顯示 Email (唯讀) -->
        <!-- <div class="mb-3">
          <label class="form-label">帳號 Email</label>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            readonly
          />
        </div> -->

        <!-- 新密碼 -->
        <div class="mb-3">
          <label class="form-label">新密碼</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="newPassword"
            name="newPassword"
            required
          />
        </div>

        <!-- 確認密碼 -->
        <div class="mb-3">
          <label class="form-label">確認新密碼</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          />
        </div>

        <!-- 提交按鈕 -->
        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="loading"
        >
          {{ loading ? "重設中..." : "確認重設密碼" }}
        </button>

        <!-- 訊息區塊 -->
        <div
          *ngIf="message"
          class="alert mt-3"
          [ngClass]="{
            'alert-success': message.startsWith('good'),
            'alert-danger':
              message.startsWith('bad') || message.startsWith('!!!')
          }"
        >
          {{ message }}
        </div>
      </form>
    </div>
  </div>
</section>

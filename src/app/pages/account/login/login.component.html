<section class="vh-100">
  <div class="container-fluid h-custom">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <!-- 左邊圖片 -->
      <div class="col-md-9 col-lg-6 col-xl-5">
        <img
          src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
          class="img-fluid"
          alt="Login Image"
        />
      </div>

      <!-- 右邊表單 -->
      <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
        <form (ngSubmit)="login()">
          <!-- 社群登入（Google Button 掛載點） -->
          <div class="mb-3">
            <label class="form-label">使用社群登入</label>
            <div class="d-flex gap-2 align-items-center">
              <!--  Google 按鈕（由 Google 動態注入） -->
              <div id="googleLoginBtn"></div>

              <!--  LINE 按鈕 -->
              <button
                type="button"
                class="btn border border-dark rounded-circle d-flex align-items-center justify-content-center"
                style="
                  width: 48px;
                  height: 48px;
                  padding: 0;
                  background-color: white;
                "
                (click)="lineLogin()"
                title="使用 LINE 登入"
              >
                <img
                  src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg"
                  alt="LINE"
                  width="28"
                  height="28"
                />
              </button>
            </div>
          </div>

          <!-- 分隔線 -->
          <div class="divider d-flex align-items-center my-4">
            <p class="text-center fw-bold mx-3 mb-0">或</p>
          </div>

          <!-- 帳號 -->
          <div class="form-outline mb-4">
            <label class="form-label" for="account">帳號</label>
            <input
              type="text"
              [(ngModel)]="account"
              name="account"
              id="account"
              class="form-control form-control-lg"
              placeholder="請輸入帳號"
              required
            />
          </div>

          <!-- 密碼 -->
          <div class="form-outline mb-3">
            <label class="form-label" for="password">密碼</label>
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              id="password"
              class="form-control form-control-lg"
              placeholder="請輸入密碼"
              required
            />
          </div>

          <!-- 記住我 / 忘記密碼 -->
          <div class="d-flex justify-content-between align-items-center">
            <div class="form-check mb-0">
              <input
                class="form-check-input me-2"
                type="checkbox"
                id="rememberMe"
              />
              <label class="form-check-label" for="rememberMe">記住我</label>
            </div>
            <a routerLink="/show/forgot-password" class="text-body"
              >忘記密碼？</a
            >
          </div>

          <!-- 鎖定倒數提示（429） -->
          <div *ngIf="lockCountdown > 0" class="alert alert-warning mt-3 py-2">
            連續嘗試過多，請等 <strong>{{ lockCountdown }}</strong> 秒再試。
          </div>

          <!-- 錯誤訊息（401/一般），避免與倒數提示重疊 -->
          <div
            *ngIf="errMsg && lockCountdown === 0"
            class="alert alert-danger mt-3 py-2"
          >
            {{ errMsg }}
          </div>

          <!-- 登入按鈕 / 註冊連結 -->
          <div class="text-center text-lg-start mt-4 pt-2">
            <button
              type="submit"
              class="btn btn-primary btn-lg px-5"
              [disabled]="loading || lockCountdown > 0 || !account || !password"
              [attr.aria-disabled]="loading || lockCountdown > 0 ? true : null"
            >
              {{ loading ? "登入中…" : "登入" }}
            </button>

            <!-- 送出中遮罩 -->
            <div
              *ngIf="loading"
              class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center"
              style="background-color: rgba(255, 255, 255, 0.8); z-index: 1050"
            >
              <img
                src="assets/img/member/loading.gif"
                width="100"
                alt="Loading..."
              />
              <p class="mt-3 fw-bold text-dark">登入中，請稍候...</p>
            </div>

            <p class="small fw-bold mt-3 mb-0">
              尚未註冊？
              <a routerLink="/show/register" class="link-danger">註冊帳號</a>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
<!-- 停權通知對話框（不需 Bootstrap JS） -->
<div
  *ngIf="showBanDialog"
  class="position-fixed top-0 start-0 w-100 h-100"
  style="background: rgba(0, 0, 0, 0.5); z-index: 2000"
>
  <div class="d-flex align-items-center justify-content-center h-100">
    <div class="card shadow" style="max-width: 420px; width: 92%">
      <div class="card-header bg-danger text-white fw-bold">帳號已停權</div>
      <div class="card-body">
        <p class="mb-3">{{ banMessage }}</p>
        <ul class="small text-muted mb-3">
          <li>若你認為這是誤判，請聯繫安養院或客服。</li>
          <li>你也可以先使用忘記密碼重設，但停權仍需管理員解除。</li>
        </ul>
        <div class="text-end">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="closeBanDialog()"
          >
            我知道了
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card shadow">
  <div class="card-header bg-light">
    <h4 class="text-danger fw-bold">修改密碼</h4>
  </div>
  <div class="card-body">
    <form (ngSubmit)="changePassword()" class="row g-3">
      <div class="col-12">
        <label class="form-label">舊密碼</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="passwordData.oldPassword"
          name="oldPassword"
        />
      </div>

      <div class="col-md-6">
        <label class="form-label">新密碼</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="passwordData.newPassword"
          name="newPassword"
        />
      </div>

      <div class="col-md-6">
        <label class="form-label">確認新密碼</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="passwordData.confirmPassword"
          name="confirmPassword"
        />
      </div>

      <div class="col-12">
        <button class="btn btn-success px-4" type="submit">變更密碼</button>
      </div>

      <!-- 錯誤訊息 -->
      <div class="col-12 mt-2" *ngIf="errorMessage">
        <div class="alert alert-danger">{{ errorMessage }}</div>
      </div>

      <!-- 成功訊息 -->
      <div class="col-12 mt-2" *ngIf="successMessage">
        <div class="alert alert-success">{{ successMessage }}</div>
      </div>
    </form>
  </div>
</div>

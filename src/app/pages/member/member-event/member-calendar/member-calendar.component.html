<div class="hero">
  <div
    class="calendar-header d-flex justify-content-between align-items-center mb-3"
  >
    <h4 class="fw-bold">{{ monthLabel }}</h4>
    <div>
      <button
        class="btn btn-sm btn-outline-secondary me-2"
        (click)="nav('prev')"
      >
        〈 上月
      </button>
      <button
        class="btn btn-sm btn-outline-secondary me-2"
        (click)="nav('today')"
      >
        今天
      </button>
      <button class="btn btn-sm btn-outline-secondary" (click)="nav('next')">
        下月 〉
      </button>
    </div>
  </div>

  <div class="calendar-wrap">
    <full-calendar #fc [options]="calendarOptions"></full-calendar>
    <!-- #fc(元件名稱) [options]="calendarOptions"(屬性細節) -->
  </div>
</div>

<div class="container py-4">
  <h3 class="fw-bold mb-3">我的活動</h3>

  <!-- 查詢 + 分類 -->
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <input
      class="form-control"
      style="max-width: 360px"
      placeholder="輸入活動名稱或報名編號搜尋"
      [(ngModel)]="q"
    />
    <div class="ms-auto"></div>
    <ul class="nav nav-pills">
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="tab() === 'upcoming'"
          (click)="tab.set('upcoming')"
        >
          未開始
        </button>
      </li>
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="tab() === 'completed'"
          (click)="tab.set('completed')"
        >
          已參加
        </button>
      </li>
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="tab() === 'all'"
          (click)="tab.set('all')"
        >
          全部
        </button>
      </li>
    </ul>
  </div>

  <!-- 載入 / 錯誤 -->
  <div *ngIf="loading()" class="text-muted">載入中…</div>
  <div *ngIf="error()" class="text-danger">{{ error() }}</div>

  <!-- 列表 -->
  <div class="card shadow-sm" *ngIf="!loading() && !error()">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width: 26%">報名編號</th>
            <th>活動名稱</th>
            <th style="width: 26%">活動時間</th>
            <th style="width: 12%" class="text-center">狀態</th>
            <th style="width: 10%" class="text-center">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of viewRows()">
            <td class="text-muted">
              <div class="fw-semibold">{{ r.registrationNum }}</div>
            </td>
            <td>
              {{ r.eventName }}
            </td>
            <td>
              {{ r.startAt | date : "yyyy/MM/dd HH:mm" }}
            </td>
            <td class="text-center">
              <span [class]="badgeClass(r)">{{ statusLabel(r) }}</span>
            </td>
            <td class="text-center">
              <!-- 先用 registrationId；有需要再做詳情頁 -->
              <a
                class="btn btn-sm btn-outline-secondary"
                [routerLink]="['/show/event', r.eventBatchId]"
                >檢視</a
              >
            </td>
          </tr>

          <tr *ngIf="viewRows().length === 0">
            <td colspan="5" class="text-center text-muted py-4">
              沒有符合條件的活動
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
